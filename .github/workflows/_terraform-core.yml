name: Terraform Core

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, uat, prod)"
        required: true
        type: string
      action:
        description: "Action to perform (plan or apply)"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  terraform:
    name: ${{ inputs.action }} / ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/${{ inputs.environment }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_CLI_ARGS_init: "-upgrade=false"

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Terraform Version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact --recursive

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/${{ inputs.environment }}
          framework: terraform
          soft_fail: false
          output_format: cli

      - name: Setup Infracost
        if: inputs.action == 'plan'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Report
        if: inputs.action == 'plan'
        id: infracost
        run: |
          infracost breakdown \
            --path terraform/${{ inputs.environment }} \
            --format json \
            --out-file /tmp/infracost.json
          
          MONTHLY=$(jq -r '.totalMonthlyCost // "0"' /tmp/infracost.json)
          echo "monthly_cost=\$${MONTHLY}" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        if: inputs.action == 'plan'
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -input=false -out=tfplan 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi
          
          echo "exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload Plan Artifact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform/${{ inputs.environment }}/tfplan
          retention-days: 5

      - name: Comment Plan on PR
        if: inputs.action == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: terraform/${{ inputs.environment }}/plan.txt
          MONTHLY_COST: ${{ steps.infracost.outputs.monthly_cost }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const cost = process.env.MONTHLY_COST || 'N/A';
            
            const body = `### 🏗️ Terraform Plan: \`${{ inputs.environment }}\`
            
            **Environment:** ${{ inputs.environment }}
            **Estimated Monthly Cost:** ${cost}
            
            <details><summary>📋 Show Plan Output</summary>
            
            \`\`\`hcl
            ${plan.substring(0, 60000)}
            \`\`\`
            
            </details>
            
            *Triggered by @${{ github.actor }} via \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false -no-color
