name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  drift:
    name: Drift Check / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]
        include:
          - environment: dev
            client_id_secret: AZURE_CLIENT_ID_DEV
            sub_id_secret: AZURE_SUBSCRIPTION_ID_DEV
          - environment: uat
            client_id_secret: AZURE_CLIENT_ID_UAT
            sub_id_secret: AZURE_SUBSCRIPTION_ID_UAT
          - environment: prod
            client_id_secret: AZURE_CLIENT_ID_PROD
            sub_id_secret: AZURE_SUBSCRIPTION_ID_PROD

    env:
      ARM_CLIENT_ID: ${{ secrets[matrix.client_id_secret] }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[matrix.sub_id_secret] }}
      ARM_USE_OIDC: true

    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Read Terraform Version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: terraform/${{ matrix.environment }}
        run: terraform init

      - name: Check for Drift
        id: drift
        working-directory: terraform/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Terraform plan failed"
            exit 1
          fi

      - name: Create GitHub Issue if Drift Detected
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync(
              'terraform/${{ matrix.environment }}/drift.txt',
              'utf8'
            );
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Drift Detected: ${{ matrix.environment }}`,
              labels: ['drift', 'infrastructure', '${{ matrix.environment }}'],
              body: `## Infrastructure Drift Detected
              
              **Environment:** \`${{ matrix.environment }}\`
              **Detected:** ${new Date().toISOString()}
              
              Someone made manual changes in Azure Portal.
              
              <details><summary>Drift Details</summary>
              
              \`\`\`
              ${drift.substring(0, 60000)}
              \`\`\`
              
              </details>`
            });
